name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Syntax check (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check server entrypoints
        run: |
          node --check server.js
          node --check gateway.js
          node --check browser-login.js
          node --check public/app.js
      - name: Boot smoke test
        shell: bash
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8788/api/state; then
              echo "panel responded"; break
            fi
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8788/api/state || (echo "panel did not start"; exit 1)
          kill $SERVER_PID || true
